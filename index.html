<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#00739A" />
    <title>AirCleanB - Airbnb Turnover Cleaning in DC, MD &amp; VA</title>
    <meta name="description" content="Airbnb turnover cleaning in DC, Maryland and Virginia. Done before check-in, photos of every room, problems flagged right away. Turnovers from $110." />

    <!-- Link previews on WhatsApp, iMessage and Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AirCleanB" />
    <meta property="og:url" content="https://www.aircleanb.com/" />
    <meta property="og:title" content="AirCleanB - Airbnb Turnover Cleaning in DC, MD &amp; VA" />
    <meta property="og:description" content="Done before check-in. Photos of every room, and any problem flagged right away. Turnovers from $110." />
    <meta property="og:image" content="https://www.aircleanb.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Public+Sans:wght@400;600;700&display=swap" />
    <!-- First carousel photo, so the hero image starts downloading before the JS runs -->
    <link rel="preload" as="image" href="/images/carousel/bedroom-bright-800.webp" imagesrcset="/images/carousel/bedroom-bright-800.webp 800w, /images/carousel/bedroom-bright-1600.webp 1600w" imagesizes="(max-width: 768px) 100vw, 50vw" />

    <!-- Google tag (gtag.js) — production domain only, so deploy previews and
         localhost never send conversions. Off production window.gtag stays
         undefined; every call site checks for it before calling. -->
    <script>
      (function () {
        var h = location.hostname;
        if (h !== 'aircleanb.com' && !h.endsWith('.aircleanb.com')) return;
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=AW-17464291569';
        document.head.appendChild(s);
        window.dataLayer = window.dataLayer || [];
        window.gtag = function () { dataLayer.push(arguments); };
        gtag('js', new Date());
        gtag('config', 'AW-17464291569');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
